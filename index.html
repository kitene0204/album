<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 추억 사진관</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* ❗ 배달의 민족 폰트 적용 ❗ */
        @font-face {
            font-family: 'BMDOHYEON';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMDOHYEON.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'BMJUA';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body { font-family: 'BMDOHYEON', sans-serif; letter-spacing: 0.5px; }
        
        /* 슬라이드쇼 오버레이 타이틀은 감성적인 주아체로 */
        #overlay-title-text { font-family: 'BMJUA', sans-serif; letter-spacing: 1px; }

        /* 입력창이나 버튼 안의 작은 글씨들은 가독성을 위해 시스템 기본 폰트 유지 */
        input, .text-sm, .text-xs { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

        /* 슬라이드쇼 부모 컨테이너 */
        #slideshow-container {
            /* background-color: #111; 삭제: 투명하게 변경하여 파스텔 배경 노출 */
            background-color: transparent;
            overflow: hidden;
            position: relative;
            z-index: 10; /* 배경 장식보다 위에 오도록 설정 */
        }

        /* 🎨 파스텔 배경 및 둥둥 떠다니는 아이콘 애니메이션 */
        .pastel-bg {
            background: linear-gradient(-45deg, #fdfbfb, #f3e5f5, #e0f7fa, #fff3e0);
            background-size: 400% 400%;
            animation: pastelGradient 15s ease infinite;
        }
        @keyframes pastelGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .floating-icon {
            position: absolute;
            animation: floatIcon 6s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            33% { transform: translateY(-20px) rotate(15deg) scale(1.1); }
            66% { transform: translateY(15px) rotate(-10deg) scale(0.9); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }

        /* 📸 액자 디자인 CSS 📸 */
        .slide-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center; /* 오타 수정: 가운데 정렬 완벽 적용 */
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            padding: 20px;
        }
        .slide-wrapper.active { opacity: 1; }

        /* 슬라이드 내부 컨테이너 (움직임 효과 적용 대상) */
        .slide-content {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
            transition: transform 4s ease-in-out;
            will-change: transform;
        }

        /* 이미지 기본 */
        .slide-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 1. 기본 (None) */
        .frame-none .slide-img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        /* 2. 폴라로이드 감성 */
        .frame-polaroid {
            background-color: #f9f9f9;
            padding: 1.5vw 1.5vw 6vw 1.5vw;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-radius: 4px;
            max-width: 90vw;
            max-height: 90vh;
        }
        .frame-polaroid .slide-img { max-height: calc(90vh - 7.5vw); }

        /* 3. 클래식 원목 액자 */
        .frame-wood {
            background-color: #fff;
            padding: 1vw;
            border: 20px solid #5c4033;
            border-image: linear-gradient(45deg, #3e2723, #8d6e63, #3e2723) 1;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 20px 40px rgba(0,0,0,0.7);
            max-width: 90vw;
            max-height: 90vh;
        }
        .frame-wood .slide-img { max-height: calc(90vh - 2vw - 40px); }

        /* 4. 영화 필름 스타일 */
        .frame-film {
            background-color: #000;
            padding: 3vw 0;
            background-image: 
                repeating-linear-gradient(to right, transparent, transparent 15px, #fff 15px, #fff 25px),
                repeating-linear-gradient(to right, transparent, transparent 15px, #fff 15px, #fff 25px);
            background-position: top, bottom;
            background-size: 100% 20px;
            background-repeat: no-repeat;
            max-width: 95vw;
            max-height: 90vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .frame-film .slide-img { 
            border-top: 2px solid #333;
            border-bottom: 2px solid #333;
            max-height: calc(90vh - 6vw); 
        }

        /* 전환 효과들 */
        .effect-fade { transform: scale(1); }
        .slide-wrapper.active .effect-fade { transform: scale(1.02); }
        .effect-zoom { transform: scale(1); }
        .slide-wrapper.active .effect-zoom { transform: scale(1.08); }
        .effect-pan-right { transform: translateX(-2%) scale(1.03); }
        .slide-wrapper.active .effect-pan-right { transform: translateX(0) scale(1.03); }
        .effect-pan-left { transform: translateX(2%) scale(1.03); }
        .slide-wrapper.active .effect-pan-left { transform: translateX(0) scale(1.03); }

        /* UI 컨트롤 패널 */
        #slideshow-controls { opacity: 0; transition: opacity 0.3s ease; }
        #slideshow-container:hover #slideshow-controls,
        #slideshow-container:active #slideshow-controls { opacity: 1; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-blue-200">

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-11/12 max-w-md"></div>

    <main id="setup-view" class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
            <header class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white text-center relative overflow-hidden flex flex-col items-center">
                <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
                
                <h1 id="main-title-display" class="text-3xl sm:text-4xl font-bold mb-3 relative z-10 drop-shadow-md">
                    <i class="fas fa-camera-retro mr-3 text-blue-200"></i>우리반 추억 사진관
                </h1>
                
                <button onclick="openSettingsModal()" class="relative z-10 bg-white/20 hover:bg-white/40 text-white border border-white/30 px-4 py-2 rounded-full text-sm font-medium transition flex items-center backdrop-blur-sm mt-2">
                    <i class="fas fa-cog mr-2"></i> 제목 및 디자인 설정
                </button>
            </header>

            <div class="p-6 sm:p-10 space-y-8">
                <section>
                    <div class="flex items-center mb-4">
                        <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3 shadow-sm">1</div>
                        <h2 class="text-xl font-bold text-slate-700">사진 불러오기</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="group border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center hover:bg-yellow-50 hover:border-yellow-400 transition-all cursor-pointer shadow-sm" onclick="document.getElementById('folder-upload').click()">
                            <div class="w-14 h-14 mx-auto bg-yellow-100 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fas fa-folder-open text-2xl text-yellow-500"></i>
                            </div>
                            <h3 class="font-bold text-slate-700 mt-3 text-lg">폴더 단위로 추가</h3>
                            <input type="file" id="folder-upload" webkitdirectory directory multiple class="hidden" accept="image/*" onchange="handleFiles(this.files)">
                        </div>
                        
                        <div class="group border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center hover:bg-green-50 hover:border-green-400 transition-all cursor-pointer shadow-sm" onclick="document.getElementById('file-upload').click()">
                            <div class="w-14 h-14 mx-auto bg-green-100 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i class="fas fa-images text-2xl text-green-500"></i>
                            </div>
                            <h3 class="font-bold text-slate-700 mt-3 text-lg">사진 파일로 추가</h3>
                            <input type="file" id="file-upload" multiple class="hidden" accept="image/*" onchange="handleFiles(this.files)">
                        </div>
                    </div>

                    <div class="mt-4 flex items-center justify-between bg-slate-100 py-3 px-5 rounded-xl border border-slate-200">
                        <div class="flex items-center">
                            <i class="fas fa-check-circle text-slate-400 mr-2" id="status-icon"></i>
                            <span class="text-slate-600">준비된 사진: <strong id="photo-count" class="text-blue-600 text-xl mx-1">0</strong> 장</span>
                        </div>
                        <button onclick="clearPhotos()" class="text-sm font-medium text-red-500 hover:bg-red-100 px-3 py-1 rounded transition hidden" id="clear-photos-btn">
                            <i class="fas fa-trash-alt mr-1"></i>비우기
                        </button>
                    </div>
                </section>

                <hr class="border-slate-100">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <section class="flex flex-col">
                        <div class="flex items-center mb-4">
                            <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3 shadow-sm">2</div>
                            <h2 class="text-xl font-bold text-slate-700">재생 시간</h2>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex-1 flex flex-col justify-center">
                            <label for="duration-val" class="block text-slate-600 mb-3 font-medium">사진 한 장당 머무는 시간</label>
                            <div class="flex items-center">
                                <input type="range" id="duration-slider" min="0.5" max="15" step="0.5" value="4" class="w-full mr-4 accent-blue-600" oninput="document.getElementById('duration-val').value = this.value">
                                <div class="bg-white border border-slate-200 rounded-lg px-2 py-1 flex items-center shadow-inner">
                                    <input type="number" id="duration-val" value="4" min="0.1" max="60" step="0.1" class="font-bold text-blue-600 w-16 text-center focus:outline-none bg-transparent" oninput="document.getElementById('duration-slider').value = this.value">
                                    <span class="text-slate-500 font-bold pr-2">초</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="music-section" class="flex flex-col transition-all duration-500 rounded-2xl">
                        <div class="flex items-center mb-4">
                            <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3 shadow-sm">3</div>
                            <h2 class="text-xl font-bold text-slate-700">배경 음악 (선택)</h2>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex-1 flex flex-col justify-center">
                            <div class="flex flex-col gap-2 relative z-10">
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fab fa-youtube text-red-500"></i></div>
                                    <input type="text" id="youtube-link" placeholder="유튜브 BGM 링크 붙여넣기" class="w-full pl-10 pr-20 py-2 border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="applyYoutubeLink()" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded-xl text-sm font-bold border border-blue-200"><i class="fas fa-check mr-1"></i> 적용</button>
                                    <button onclick="searchYoutube()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-sm font-medium border border-slate-200"><i class="fas fa-search mr-1"></i> 검색</button>
                                </div>
                                <div class="relative mt-2">
                                    <input type="file" id="audio-upload" accept="audio/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 border border-slate-200 rounded-xl bg-white cursor-pointer shadow-sm">
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="pt-4 pb-2 text-center">
                    <button onclick="startSlideshow()" class="group relative inline-flex items-center justify-center px-12 py-5 text-xl font-bold text-white transition-all duration-200 bg-blue-600 rounded-full hover:bg-blue-700 hover:shadow-lg hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-blue-300 w-full sm:w-auto">
                        <i class="fas fa-play mr-3 group-hover:scale-110 transition-transform"></i>
                        <span>슬라이드쇼 시작</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300" id="settings-modal-content">
            <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
                <h2 class="text-2xl font-bold"><i class="fas fa-palette mr-2"></i>스타일 설정</h2>
                <button onclick="closeSettingsModal()" class="text-white/70 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-8 space-y-6">
                <div>
                    <label class="block text-slate-700 font-bold mb-2">슬라이드쇼 제목</label>
                    <input type="text" id="setting-title" value="우리반 추억 사진관" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
                    <p class="text-xs text-slate-400 mt-1">이 제목은 메인 화면과 슬라이드쇼 시작 화면에 나타납니다.</p>
                </div>
                
                <div>
                    <label class="block text-slate-700 font-bold mb-3">사진 액자(프레임) 디자인</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="frame-style" value="frame-none" class="peer hidden" checked>
                            <div class="border-2 border-slate-200 rounded-xl p-4 text-center peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-slate-50 transition">
                                <i class="fas fa-image text-2xl text-slate-400 mb-2"></i>
                                <div class="font-bold text-slate-700">기본 (없음)</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="frame-style" value="frame-polaroid" class="peer hidden">
                            <div class="border-2 border-slate-200 rounded-xl p-4 text-center peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-slate-50 transition">
                                <i class="fas fa-sticky-note text-2xl text-slate-400 mb-2"></i>
                                <div class="font-bold text-slate-700">폴라로이드</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="frame-style" value="frame-wood" class="peer hidden">
                            <div class="border-2 border-slate-200 rounded-xl p-4 text-center peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-slate-50 transition">
                                <i class="fas fa-border-all text-2xl text-slate-400 mb-2"></i>
                                <div class="font-bold text-slate-700">원목 액자</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="frame-style" value="frame-film" class="peer hidden">
                            <div class="border-2 border-slate-200 rounded-xl p-4 text-center peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-slate-50 transition">
                                <i class="fas fa-film text-2xl text-slate-400 mb-2"></i>
                                <div class="font-bold text-slate-700">영화 필름</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="p-6 bg-slate-50 border-t border-slate-100 text-right">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition">저장하기</button>
            </div>
        </div>
    </div>

    <div id="slideshow-view" class="hidden fixed inset-0 z-50 pastel-bg flex flex-col w-full h-full">
        
        <!-- 🎨 파스텔 배경 장식 (아이콘들) -->
        <div id="slideshow-decorations" class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <!-- 왼쪽 장식 -->
            <i class="floating-icon fas fa-school text-6xl text-blue-300/70" style="top: 15%; left: 8%; animation-delay: 0s;"></i>
            <i class="floating-icon fas fa-futbol text-7xl text-slate-400/50" style="top: 45%; left: 5%; animation-delay: 1.2s;"></i>
            <i class="floating-icon fas fa-hamburger text-6xl text-orange-300/70" style="top: 75%; left: 10%; animation-delay: 2.4s;"></i>
            <i class="floating-icon fas fa-music text-5xl text-purple-300/70" style="top: 30%; left: 20%; animation-delay: 3.1s;"></i>
            <i class="floating-icon fas fa-star text-6xl text-yellow-300/80" style="top: 85%; left: 18%; animation-delay: 0.8s;"></i>
            
            <!-- 오른쪽 장식 -->
            <i class="floating-icon fas fa-palette text-7xl text-pink-300/70" style="top: 20%; right: 8%; animation-delay: 0.5s;"></i>
            <i class="floating-icon fas fa-film text-6xl text-slate-400/50" style="top: 55%; right: 5%; animation-delay: 2.1s;"></i>
            <i class="floating-icon fas fa-camera-retro text-7xl text-teal-300/70" style="top: 80%; right: 10%; animation-delay: 1.7s;"></i>
            <i class="floating-icon fas fa-heart text-5xl text-red-300/70" style="top: 35%; right: 20%; animation-delay: 3.5s;"></i>
            <i class="floating-icon fas fa-book text-6xl text-indigo-300/70" style="top: 10%; right: 18%; animation-delay: 2.8s;"></i>
        </div>

        <div id="slideshow-title-overlay" class="absolute inset-0 flex items-center justify-center z-40 pointer-events-none opacity-0 transition-opacity duration-1000 bg-black/40">
            <h1 id="overlay-title-text" class="text-4xl md:text-7xl text-white font-bold text-center drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] px-8"></h1>
        </div>

        <div id="slideshow-container" class="flex-1 w-full h-full relative cursor-none" onmousemove="showControlsTemporary()"></div>

        <div id="youtube-player-container" style="position: absolute; top: -9999px; left: -9999px; width: 300px; height: 300px; opacity: 0.01; pointer-events: none; z-index: -1;">
            <div id="youtube-player"></div>
        </div>

        <div id="slideshow-controls" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 via-black/50 to-transparent p-4 sm:p-8 flex justify-between items-center text-white pb-6 z-50">
            <button onclick="stopSlideshow()" class="text-white hover:text-red-400 bg-white/10 px-4 py-2.5 rounded-xl backdrop-blur-md transition flex items-center text-sm font-medium">
                <i class="fas fa-arrow-left mr-2"></i> 설정으로
            </button>
            <div class="flex items-center space-x-6">
                <button onclick="prevSlide()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/30 transition text-xl backdrop-blur-md"><i class="fas fa-step-backward"></i></button>
                <button onclick="togglePlayPause()" id="play-pause-btn" class="w-16 h-16 flex items-center justify-center rounded-full bg-blue-600 hover:bg-blue-500 transition text-2xl"><i class="fas fa-pause"></i></button>
                <button onclick="nextSlide()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/30 transition text-xl backdrop-blur-md"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="flex items-center bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md">
                <i class="fas fa-volume-up text-sm mr-3"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="setVolume(this.value)" class="w-24 accent-white h-1.5 bg-white/30 rounded-lg cursor-pointer">
            </div>
        </div>
    </div>
    <audio id="local-audio" loop></audio>

    <script>
        /* =========================================
           ❗ Firebase & 데이터 저장 로직 ❗
        ========================================= */
        
        // 선생님의 Firebase 프로젝트 설정값을 여기에 넣으시면 기기가 바뀌어도 동기화됩니다.
        // (입력하지 않아도 현재 컴퓨터의 로컬스토리지에 안전하게 자동 저장됩니다!)
        const firebaseConfig = {
            // apiKey: "YOUR_API_KEY",
            // authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            // projectId: "YOUR_PROJECT_ID"
        };

        let db = null;
        try {
            if (Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log("Firebase 연동 성공!");
            }
        } catch(e) { console.warn("Firebase 설정 없음. 로컬 저장소를 사용합니다."); }

        // 전역 설정 변수
        let appSettings = {
            title: "우리반 추억 사진관",
            frameStyle: "frame-none"
        };

        // 설정 불러오기 (앱 시작 시 실행)
        async function loadSettings() {
            // 1. 로컬 스토리지 확인 (빠른 로딩)
            const localSet = localStorage.getItem('classPhotoSettings');
            if (localSet) appSettings = JSON.parse(localSet);

            // 2. Firebase 확인 (우선 적용)
            if (db) {
                try {
                    const doc = await db.collection("settings").doc("mainConfig").get();
                    if (doc.exists) appSettings = doc.data();
                } catch(e) { console.error("Firebase 불러오기 실패", e); }
            }
            
            // 화면 UI 업데이트
            document.getElementById('main-title-display').innerHTML = `<i class="fas fa-camera-retro mr-3 text-blue-200"></i>${appSettings.title}`;
            document.getElementById('setting-title').value = appSettings.title;
            document.querySelector(`input[value="${appSettings.frameStyle}"]`).checked = true;
        }

        // 설정 저장하기
        async function saveSettings() {
            appSettings.title = document.getElementById('setting-title').value.trim() || "우리반 추억 사진관";
            appSettings.frameStyle = document.querySelector('input[name="frame-style"]:checked').value;

            // 화면 즉시 적용
            document.getElementById('main-title-display').innerHTML = `<i class="fas fa-camera-retro mr-3 text-blue-200"></i>${appSettings.title}`;
            
            // 1. 로컬 저장 (안전장치)
            localStorage.setItem('classPhotoSettings', JSON.stringify(appSettings));

            // 2. Firebase 저장
            if (db) {
                try {
                    await db.collection("settings").doc("mainConfig").set(appSettings);
                } catch(e) { console.error("Firebase 저장 실패", e); }
            }

            closeSettingsModal();
            showToast("디자인 설정이 저장되었습니다!", "success");
        }

        // 설정 모달 열고 닫기
        function openSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-modal-content');
            modal.classList.remove('hidden');
            // 부드러운 애니메이션
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });
        }
        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // 페이지 로드 시 설정 불러오기 실행
        window.addEventListener('DOMContentLoaded', loadSettings);

        /* =========================================
           유튜브 및 슬라이드쇼 기존 로직 (수정본)
        ========================================= */
        let ytPlayer = null; let isYtReady = false;
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        window.onYouTubeIframeAPIReady = function() { isYtReady = true; };

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const isError = type === 'error';
            toast.className = `px-5 py-3 rounded-2xl text-white font-bold shadow-lg transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-3 w-full backdrop-blur-md ${isError ? 'bg-red-500/90' : 'bg-green-500/90'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'} text-xl"></i> <span class="leading-tight">${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-20px]'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        let images = []; let currentIndex = 0; let slideIntervalId = null; let isPlaying = false; let slideDuration = 4000; let controlsTimeout = null;
        const effects = ['effect-fade', 'effect-zoom', 'effect-pan-right', 'effect-pan-left'];

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.startsWith('image/')) images.push(URL.createObjectURL(files[i]));
            }
            document.getElementById('photo-count').innerText = images.length;
            document.getElementById('clear-photos-btn').classList.remove('hidden');
        }
        function clearPhotos() {
            images = []; document.getElementById('photo-count').innerText = 0;
            document.getElementById('clear-photos-btn').classList.add('hidden');
            showToast('사진이 비워졌습니다.', 'success');
        }

        function getYouTubeId(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }
        function searchYoutube() { window.open('https://www.youtube.com/results?search_query=감동적인 bgm', '_blank'); }
        function applyYoutubeLink() {
            const url = document.getElementById('youtube-link').value.trim();
            if (getYouTubeId(url)) showToast("유튜브 링크가 적용되었습니다.", "success");
            else showToast("올바른 유튜브 링크를 넣어주세요.");
        }

        function setupAudio() {
            const localFile = document.getElementById('audio-upload').files[0];
            const ytLink = document.getElementById('youtube-link').value.trim();
            const localAudio = document.getElementById('local-audio');
            const vol = document.getElementById('volume-slider').value;
            
            localAudio.pause(); localAudio.src = '';
            if (localFile) {
                if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
                localAudio.src = URL.createObjectURL(localFile); localAudio.volume = vol/100; localAudio.play();
            } else if (ytLink) {
                const vid = getYouTubeId(ytLink);
                if (vid && isYtReady) {
                    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                        ytPlayer.loadVideoById(vid); ytPlayer.setVolume(vol);
                    } else {
                        ytPlayer = new YT.Player('youtube-player', {
                            height: '300', width: '300', videoId: vid,
                            playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1, 'playlist': vid, 'origin': window.location.origin },
                            events: { 'onReady': e => { e.target.setVolume(vol); e.target.playVideo(); }, 'onStateChange': e => { if(e.data===0) e.target.playVideo(); } }
                        });
                    }
                }
            }
        }

        function setVolume(val) {
            document.getElementById('local-audio').volume = val/100;
            if (ytPlayer && typeof ytPlayer.setVolume === 'function') ytPlayer.setVolume(val);
        }

        function startSlideshow() {
            if (images.length === 0) { showToast("사진을 먼저 추가해주세요."); return; }
            slideDuration = (parseFloat(document.getElementById('duration-val').value) || 4) * 1000;
            
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('slideshow-view').classList.remove('hidden');
            showControlsTemporary();
            setupAudio();
            
            // 타이틀 오버레이 표시
            const overlay = document.getElementById('slideshow-title-overlay');
            document.getElementById('overlay-title-text').innerText = appSettings.title;
            overlay.classList.remove('opacity-0');
            setTimeout(() => overlay.classList.add('opacity-0'), 4000);

            currentIndex = 0; document.getElementById('slideshow-container').innerHTML = '';
            showSlide(currentIndex);
            isPlaying = true; slideIntervalId = setInterval(nextSlide, slideDuration);
            updatePlayPauseIcon();
        }

        /* ❗ 액자가 적용된 슬라이드 생성 로직 ❗ */
        function showSlide(index) {
            // 1. 투명도를 조절할 최상위 래퍼
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';
            
            // 2. 애니메이션(줌/팬)이 들어갈 중간 래퍼 + 액자 디자인 적용
            const content = document.createElement('div');
            content.className = `slide-content ${appSettings.frameStyle}`;
            const randomEffect = effects[Math.floor(Math.random() * effects.length)];
            content.classList.add(randomEffect);

            // 3. 실제 이미지 태그
            const img = document.createElement('img');
            img.src = images[index];
            img.className = 'slide-img';
            
            content.appendChild(img);
            wrapper.appendChild(content);
            const container = document.getElementById('slideshow-container');
            container.appendChild(wrapper);

            // 렌더링 큐 이후에 active 클래스 추가하여 페이드인 효과 발동
            requestAnimationFrame(() => setTimeout(() => wrapper.classList.add('active'), 50));

            // 이전 슬라이드 정리
            const allWrappers = container.querySelectorAll('.slide-wrapper');
            if (allWrappers.length > 2) {
                setTimeout(() => { if (allWrappers[0]) container.removeChild(allWrappers[0]); }, 2000);
            }
            allWrappers.forEach(w => { if (w !== wrapper) w.classList.remove('active'); });
        }

        function nextSlide() { if(images.length===0)return; currentIndex = (currentIndex + 1) % images.length; showSlide(currentIndex); }
        function prevSlide() { if(images.length===0)return; currentIndex = (currentIndex - 1 + images.length) % images.length; showSlide(currentIndex); resetInterval(); }
        function togglePlayPause() {
            if (isPlaying) {
                clearInterval(slideIntervalId); isPlaying = false;
                if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
                document.getElementById('local-audio').pause();
            } else {
                nextSlide(); slideIntervalId = setInterval(nextSlide, slideDuration); isPlaying = true;
                if (ytPlayer && typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
                if (document.getElementById('local-audio').src) document.getElementById('local-audio').play();
            }
            updatePlayPauseIcon();
        }
        function updatePlayPauseIcon() {
            const btn = document.getElementById('play-pause-btn');
            btn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play ml-1"></i>';
        }
        function resetInterval() { if (isPlaying) { clearInterval(slideIntervalId); slideIntervalId = setInterval(nextSlide, slideDuration); } }
        function stopSlideshow() {
            clearInterval(slideIntervalId); isPlaying = false;
            document.getElementById('local-audio').pause();
            if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
            document.getElementById('slideshow-container').classList.remove('cursor-none');
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('slideshow-view').classList.add('hidden');
        }
        function showControlsTemporary() {
            document.getElementById('slideshow-container').classList.remove('cursor-none');
            document.getElementById('slideshow-controls').style.opacity = '1';
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => { if(isPlaying){ document.getElementById('slideshow-container').classList.add('cursor-none'); document.getElementById('slideshow-controls').style.opacity = '0'; } }, 3000);
        }
        document.addEventListener('keydown', e => {
            if (document.getElementById('slideshow-view').classList.contains('hidden')) return;
            showControlsTemporary();
            if (e.key === 'ArrowRight') { nextSlide(); resetInterval(); } 
            else if (e.key === 'ArrowLeft') { prevSlide(); resetInterval(); } 
            else if (e.key === ' ') { e.preventDefault(); togglePlayPause(); } 
            else if (e.key === 'Escape') stopSlideshow();
        });
    </script>
</body>
</html>
